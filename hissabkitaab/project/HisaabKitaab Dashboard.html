<!DOCTYPE html>
<html lang="hi-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HisaabKitaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow-x:hidden}
  #root{min-height:100vh}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.18);border-radius:4px}
  button,input,select,textarea{font-family:inherit;border:none;outline:none}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="hk-v2-shared.jsx"></script>
<script type="text/babel" src="hk-v2-dashboard.jsx"></script>
<script type="text/babel" src="hk-v2-screens.jsx"></script>
<script type="text/babel" src="hk-v2-newbill.jsx"></script>

<script type="text/babel">
const {
  DARK, LIGHT, OR, PU, GR, SG, PARTIES_DATA,
  NavBar, BottomNav, useIsMobile,
  DashboardScreen, BillsScreen, PartiesScreen, PaymentsScreen, NewBillModal,
} = window;

function App(){
  const [dark, setDark]       = React.useState(true);
  const [tab, setTabRaw]      = React.useState('Dashboard');
  const [showBill, setShowBill] = React.useState(false);
  const isMobile              = useIsMobile();
  const T                     = dark ? DARK : LIGHT;

  // persist tab in state; guard FAB pseudo-tab
  function setTab(t){ if(t !== '__fab') setTabRaw(t); }

  const screens = {
    'Dashboard':    <DashboardScreen T={T} isMobile={isMobile} PARTIES_DATA={PARTIES_DATA}/>,
    'Mere Bills':   <BillsScreen     T={T} isMobile={isMobile} onNewBill={()=>setShowBill(true)}/>,
    'Udhar Khata':  <PartiesScreen   T={T} isMobile={isMobile}/>,
    'Payments':     <PaymentsScreen  T={T} isMobile={isMobile}/>,
  };

  return(
    <div style={{minHeight:'100vh', background:T.bg, color:T.text, fontFamily:SG, transition:'background 0.25s, color 0.25s'}}>

      <NavBar
        T={T} tab={tab} setTab={setTab}
        dark={dark} setDark={setDark}
        onNewBill={()=>setShowBill(true)}
        isMobile={isMobile}
      />

      {/* Main scrollable content */}
      <div style={{minHeight:'calc(100vh - 60px)', overflowY:'auto'}}>
        {screens[tab] || screens['Dashboard']}
      </div>

      {/* Mobile bottom nav */}
      {isMobile && (
        <BottomNav T={T} tab={tab} setTab={setTab} onNewBill={()=>setShowBill(true)}/>
      )}

      {/* New Bill panel */}
      {showBill && (
        <NewBillModal
          T={T}
          isMobile={isMobile}
          onClose={()=>setShowBill(false)}
          onSuccess={()=>{ setShowBill(false); setTab('Mere Bills'); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
