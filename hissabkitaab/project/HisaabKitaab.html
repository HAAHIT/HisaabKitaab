<!DOCTYPE html>
<html lang="hi-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HisaabKitaab — Complete Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi:ital@0;1&family=Eczar:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-family:'Inter',-apple-system,sans-serif}
  body{overflow-x:hidden}
  #root{min-height:100vh}
  /* Light-theme ruled paper backdrop — subtle horizontal ledger lines */
  body.hk3-light::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 27px,
      rgba(60,40,15,0.04) 28px,
      transparent 29px
    );
    opacity:0.7;
  }
  #root{position:relative;z-index:1}
  button,input,select,textarea{font-family:inherit;border:none;outline:none}
  /* Accessible focus ring for keyboard users — restored after outline:none */
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline: 2px solid #2563eb;
    outline-offset: 2px;
    border-radius: 6px;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  a{color:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.2);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,0.35)}

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes sheetRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="hk3-design.jsx"></script>
<script type="text/babel" src="hk3-data.jsx"></script>
<script type="text/babel" src="hk3-shell.jsx"></script>
<script type="text/babel" src="hk3-screens-core.jsx"></script>
<script type="text/babel" src="hk3-screens-detail.jsx"></script>
<script type="text/babel" src="hk3-screens-extras.jsx"></script>
<script type="text/babel" src="hk3-flows.jsx"></script>
<script type="text/babel" src="hk3-screens-misc.jsx"></script>

<script type="text/babel">
const {
  LIGHT, DARK, ThemeContext, FONT,
  Toast, Skeleton, ErrorState,
  useIsMobile,
  TopBar, MobileTopBar, BottomNav, QuickAddSheet, MoreMenuSheet,
  DashboardScreen, BillsScreen, PartiesScreen, PaymentsScreen,
  BillDetail, PartyDetail, NewBillSheet, NewPaymentSheet, AddPartySheet,
  PurchasesScreen, BankingScreen, NotesScreen, TransactionsScreen, NewNoteSheet, TransferSheet,
  OnboardingWizard, TallyExportScreen, TallyImportScreen, TallyHubScreen, ReconcileScreen,
  LoginScreen, SettingsScreen, ReportsScreen,
} = window;

function App(){
  const [authed, setAuthed] = React.useState(() => localStorage.getItem('hk3-authed') === '1');
  const [onboarded, setOnboarded] = React.useState(() => localStorage.getItem('hk3-onboarded') === '1');
  const [theme, setThemeState] = React.useState(() => {
    const saved = localStorage.getItem('hk3-theme');
    return saved === 'dark' ? DARK : LIGHT;   // LIGHT default — dukandaar reads in shop daylight
  });

  const toggleTheme = () => {
    setThemeState(prev => {
      const next = prev.id === 'dark' ? LIGHT : DARK;
      localStorage.setItem('hk3-theme', next.id);
      return next;
    });
  };

  // Persist auth + onboarding
  React.useEffect(()=>{ localStorage.setItem('hk3-authed', authed?'1':'0'); }, [authed]);
  React.useEffect(()=>{ localStorage.setItem('hk3-onboarded', onboarded?'1':'0'); }, [onboarded]);

  // Toggle body class for light-mode ruled-paper backdrop
  React.useEffect(()=>{
    document.body.classList.toggle('hk3-light', theme.id === 'light');
    document.body.classList.toggle('hk3-dark',  theme.id === 'dark');
  }, [theme.id]);

  // Initial app load — show splash skeleton briefly
  const [initialLoading, setInitialLoading] = React.useState(true);
  React.useEffect(()=>{
    const t = setTimeout(()=>setInitialLoading(false), 700);
    return ()=>clearTimeout(t);
  },[]);

  // Navigation state — stack-style
  const [page, setPage] = React.useState('dashboard');
  const [view, setView] = React.useState(null); // { type:'billDetail'|'partyDetail', data }
  const [urlFilter, setUrlFilter] = React.useState(null);

  // Sheet state
  const [showQuickAdd, setShowQuickAdd] = React.useState(false);
  const [showMore, setShowMore] = React.useState(false);
  const [showNewBill, setShowNewBill] = React.useState(false);
  const [showNewPayment, setShowNewPayment] = React.useState(false);
  const [showAddParty, setShowAddParty] = React.useState(false);
  const [showNewNote, setShowNewNote] = React.useState(false);
  const [showTransfer, setShowTransfer] = React.useState(false);
  const [billDefaults, setBillDefaults] = React.useState({});
  const [paymentDefaults, setPaymentDefaults] = React.useState({});
  const [noteDefaults, setNoteDefaults] = React.useState({type:'CREDIT'});

  const isMobile = useIsMobile();

  function navigate(target, opts={}){
    setView(null);
    setUrlFilter(opts.filter || null);
    setPage(target);
    window.scrollTo({top:0,behavior:'instant'});
  }

  // Save theme to localStorage
  React.useEffect(()=>{
    localStorage.setItem('hk3-theme', theme.id);
  }, [theme.id]);

  // Persist nav state to URL hash (for refresh persistence)
  React.useEffect(()=>{
    if(view) return; // detail views are transient
    const hash = page + (urlFilter ? `?filter=${urlFilter}` : '');
    if(window.location.hash !== `#${hash}`){
      window.location.hash = hash;
    }
  }, [page, urlFilter, view]);

  // Sign out flow
  function signOut(){
    setShowMore(false);
    setAuthed(false);
  }

  // Restart onboarding (for demo)
  function restartOnboarding(){
    setShowMore(false);
    setOnboarded(false);
  }

  // Toast notifications
  const [toast, setToast] = React.useState(null);
  React.useEffect(()=>{
    window.__hk3_showToast = (msg, tone='positive') => setToast({msg, tone, id:Date.now()});
    return ()=>{ delete window.__hk3_showToast; };
  },[]);

  // ── Initial loading splash ────
  if(initialLoading){
    return(
      <ThemeContext.Provider value={{theme, toggleTheme}}>
        <SplashLoader theme={theme}/>
      </ThemeContext.Provider>
    );
  }

  // ── Guard: login first ────
  if(!authed){
    return(
      <ThemeContext.Provider value={{theme, toggleTheme}}>
        <LoginScreen onLogin={()=>setAuthed(true)} isMobile={isMobile}/>
      </ThemeContext.Provider>
    );
  }

  // ── Guard: onboarding ────
  if(!onboarded){
    return(
      <ThemeContext.Provider value={{theme, toggleTheme}}>
        <OnboardingWizard onComplete={()=>{ setOnboarded(true); setToast({msg:'Sab ready hai! Pehla bill banao.', tone:'positive', id:Date.now()}); }} isMobile={isMobile}/>
      </ThemeContext.Provider>
    );
  }

  // ── Render screen ─────────
  function renderScreen(){
    // Detail views take priority
    if(view?.type === 'billDetail'){
      return <BillDetail bill={view.data} onBack={()=>setView(null)} isMobile={isMobile}
        onPaymentRecord={(bill)=>{
          setPaymentDefaults({partyId:bill.partyId, direction:'INCOMING'});
          setShowNewPayment(true);
        }}/>;
    }
    if(view?.type === 'partyDetail'){
      return <PartyDetail party={view.data} onBack={()=>setView(null)} isMobile={isMobile}
        onNewBill={()=>{ setBillDefaults({partyId:view.data.id}); setShowNewBill(true); }}
        onNewPayment={()=>{ setPaymentDefaults({partyId:view.data.id, direction: view.data.balance<0?'INCOMING':'OUTGOING'}); setShowNewPayment(true); }}
        onOpenBill={(b)=>setView({type:'billDetail', data:b})}/>;
    }

    switch(page){
      case 'dashboard':
        return <DashboardScreen isMobile={isMobile} onNavigate={navigate}
          onOpenBill={(b)=>setView({type:'billDetail', data:b})}
          onOpenParty={(p)=>setView({type:'partyDetail', data:p})}/>;
      case 'bills':
        return <BillsScreen isMobile={isMobile} onNavigate={navigate}
          onOpenBill={(b)=>setView({type:'billDetail', data:b})}
          onNewBill={()=>{ setBillDefaults({}); setShowNewBill(true); }}/>;
      case 'parties':
        return <PartiesScreen isMobile={isMobile} onNavigate={navigate}
          urlFilter={urlFilter} onClearFilter={()=>setUrlFilter(null)}
          onOpenParty={(p)=>setView({type:'partyDetail', data:p})}
          onAddParty={()=>setShowAddParty(true)}/>;
      case 'payments':
        return <PaymentsScreen isMobile={isMobile} onNavigate={navigate}
          onNewPayment={()=>{ setPaymentDefaults({}); setShowNewPayment(true); }}/>;
      case 'purchases':
        return <PurchasesScreen isMobile={isMobile} onNavigate={navigate}
          onNewPurchase={()=>{ setBillDefaults({purchase:true}); setShowNewBill(true); }}/>;
      case 'banking':
        return <BankingScreen isMobile={isMobile} onNavigate={navigate}
          onTransfer={()=>setShowTransfer(true)}
          onNewAccount={()=>navigate('settings')}/>;
      case 'notes':
        return <NotesScreen isMobile={isMobile}
          onNewNote={(type)=>{ setNoteDefaults({type}); setShowNewNote(true); }}/>;
      case 'transactions':
        return <TransactionsScreen isMobile={isMobile} onBack={()=>navigate('dashboard')}/>;
      case 'reports':
        return <ReportsScreen isMobile={isMobile} onNavigate={navigate}/>;
      case 'settings':
        return <SettingsScreen isMobile={isMobile} onNavigate={navigate}
          onBack={()=>navigate('dashboard')}/>;
      case 'tally':
        return <TallyHubScreen isMobile={isMobile} onBack={()=>navigate('dashboard')}
          onExport={()=>navigate('tally-export')} onImport={()=>navigate('tally-import')}/>;
      case 'tally-export':
        return <TallyExportScreen isMobile={isMobile} onBack={()=>navigate('tally')}/>;
      case 'tally-import':
        return <TallyImportScreen isMobile={isMobile} onBack={()=>navigate('tally')}/>;
      case 'reconcile':
        return <ReconcileScreen isMobile={isMobile} onBack={()=>navigate('dashboard')}/>;
      case 'onboarding-demo':
        return <OnboardingWizard onComplete={()=>navigate('dashboard')} isMobile={isMobile}/>;
      default:
        return <DashboardScreen isMobile={isMobile} onNavigate={navigate}
          onOpenBill={(b)=>setView({type:'billDetail', data:b})}
          onOpenParty={(p)=>setView({type:'partyDetail', data:p})}/>;
    }
  }

  // ── Page titles for mobile ────
  const pageTitle = {
    dashboard: USER.business,
    bills: 'Mere Bills',
    parties: 'Udhar Khata',
    payments: 'Payments',
    purchases: 'Kharidari',
    banking: 'Banking',
    notes: 'Credit / Debit Notes',
    transactions: 'Transactions',
    reports: 'Reports',
    settings: 'Settings',
    tally: 'Tally',
    'tally-export':'Tally Export',
    'tally-import':'Tally Import',
    reconcile: 'Reconcile',
  }[page] || 'HisaabKitaab';

  // Whether bottom nav should appear (skip flow screens)
  const flowScreens = ['tally','tally-export','tally-import','reconcile','settings','transactions','onboarding-demo'];
  const showBottomNav = isMobile && !view && !flowScreens.includes(page);
  const showTopBar = !isMobile;
  const showMobileTopBar = isMobile && !flowScreens.includes(page) && !view;

  // Map top-nav tab IDs to current page
  const navTab = ['dashboard','bills','purchases','parties','payments','banking'].includes(page) ? page : null;

  return(
    <ThemeContext.Provider value={{theme, toggleTheme}}>
      <div style={{minHeight:'100vh',background:theme.bg,color:theme.text,fontFamily:FONT,transition:'background 0.25s, color 0.25s'}}>
        {showTopBar && (
          <TopBar
            page={navTab || page}
            setPage={(p)=>navigate(p)}
            onNewBill={()=>{ setBillDefaults({}); setShowNewBill(true); }}
            onMore={()=>setShowMore(true)}
          />
        )}
        {showMobileTopBar && (
          <MobileTopBar title={pageTitle} onMore={()=>setShowMore(true)}/>
        )}

        <main>{renderScreen()}</main>

        {showBottomNav && (
          <BottomNav page={page} setPage={(p)=>navigate(p)} onFab={()=>setShowQuickAdd(true)}/>
        )}

        {/* Sheets */}
        <QuickAddSheet open={showQuickAdd} onClose={()=>setShowQuickAdd(false)} isMobile={isMobile}
          onCreatePayment={()=>{ setPaymentDefaults({}); setShowNewPayment(true); }}
          onCreateBill={()=>{ setBillDefaults({}); setShowNewBill(true); }}
          onCreateParty={()=>setShowAddParty(true)}/>

        <MoreMenuSheet open={showMore} onClose={()=>setShowMore(false)} isMobile={isMobile}
          setPage={(p)=>navigate(p)} onSignOut={signOut} onRestartOnboarding={restartOnboarding}/>

        <NewBillSheet open={showNewBill} onClose={()=>setShowNewBill(false)} isMobile={isMobile} defaultPartyId={billDefaults.partyId}/>

        <NewPaymentSheet open={showNewPayment} onClose={()=>setShowNewPayment(false)} isMobile={isMobile}
          defaultPartyId={paymentDefaults.partyId} defaultDirection={paymentDefaults.direction}/>

        <AddPartySheet open={showAddParty} onClose={()=>setShowAddParty(false)} isMobile={isMobile}/>
        <NewNoteSheet open={showNewNote} onClose={()=>setShowNewNote(false)} isMobile={isMobile} defaultType={noteDefaults.type}/>
        <TransferSheet open={showTransfer} onClose={()=>setShowTransfer(false)} isMobile={isMobile}/>

        {toast && <Toast key={toast.id} message={toast.msg} tone={toast.tone} onDismiss={()=>setToast(null)}/>}
      </div>
    </ThemeContext.Provider>
  );
}

// Splash loader shown briefly on first app load
function SplashLoader({theme:T}){
  return(
    <div style={{minHeight:'100vh',background:T.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18}}>
      <div style={{
        width:80,height:80,borderRadius:24,background:'#2563eb',
        display:'flex',alignItems:'center',justifyContent:'center',
        boxShadow:'0 12px 36px rgba(37,99,235,0.4)',
        animation:'pulse 1.4s ease-in-out infinite',
      }}>
        <span style={{fontFamily:FONT,fontSize:36,fontWeight:800,color:'#fff',letterSpacing:'-1px'}}>हK</span>
      </div>
      <span style={{fontFamily:FONT,...typo('h3'),color:T.text}}>HisaabKitaab</span>
      <span style={{fontFamily:FONT,...typo('caption'),color:T.textMuted}}>Loading apka karobaar...</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
