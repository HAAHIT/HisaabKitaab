options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: asia-south1
  _REPOSITORY: doorcraft-pro
  _SERVICE_NAME: doorcraft-pro-web
  _MIGRATOR_JOB_NAME: doorcraft-pro-migrate
  _SERVICE_ACCOUNT: doorcraft-pro-runner
  _CLOUDSQL_INSTANCE: CHANGE_ME
  _DATABASE_URL_SECRET: doorcraft-database-url
  _JWT_SECRET_SECRET: doorcraft-jwt-secret
  _GCS_BUCKET_NAME: CHANGE_ME
  _CPU: "1"
  _MEMORY: 1Gi
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  _INGRESS: all

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:$COMMIT_SHA

steps:
  - id: build-web-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - .
      - --file=Dockerfile
      - --target=runner
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  - id: build-migrator-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - .
      - --file=Dockerfile
      - --target=migrator
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:$COMMIT_SHA

  - id: push-web-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  - id: push-migrator-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:$COMMIT_SHA

  - id: deploy-migration-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATOR_JOB_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest
      - --set-env-vars=NODE_ENV=production
      - --set-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --max-retries=1
      - --task-timeout=900s
      - --execute-now
      - --wait

  - id: deploy-web-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --execution-environment=gen2
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --ingress=${_INGRESS}
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,JWT_SECRET=${_JWT_SECRET_SECRET}:latest
      - --set-env-vars=NODE_ENV=production,OBJECT_STORAGE_PROVIDER=gcs,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GCS_PROJECT_ID=$PROJECT_ID
      - --set-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --allow-unauthenticated

  - id: smoke-test-health
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        SERVICE_URL="$(gcloud run services describe "${_SERVICE_NAME}" --region "${_REGION}" --format='value(status.url)')"
        curl --fail --show-error --silent "${SERVICE_URL}/api/health" > /dev/null
