options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: asia-southeast1
  _AR_REGION: asia-south1
  _REPOSITORY: solobooks
  _SERVICE_NAME: solobooks-web
  _MIGRATOR_JOB_NAME: solobooks-migrate
  _SERVICE_ACCOUNT: solobooks-runner
  _DATABASE_URL_SECRET: solobooks-database-url
  _DIRECT_URL_SECRET: solobooks-direct-url
  _JWT_SECRET_SECRET: solobooks-jwt-secret
  _GCS_BUCKET_NAME: solobooks-project-78db3a10-dbdd-4944-88b
  _CPU: "1"
  _MEMORY: 1Gi
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  _INGRESS: all

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_DIRECT_URL_SECRET}/versions/latest
      env: DIRECT_URL
    - versionName: projects/$PROJECT_ID/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL

images:
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:$COMMIT_SHA

steps:
  - id: typecheck-and-test
    name: node:22
    entrypoint: bash
    secretEnv: ['DIRECT_URL', 'DATABASE_URL']
    args:
      - -c
      - npm ci && npx tsc --noEmit

  - id: build-web-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['DIRECT_URL', 'DATABASE_URL']
    args:
      - -c
      - |
        docker pull ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest || true
        DOCKER_BUILDKIT=1 docker build . \
          --file=Dockerfile \
          --target=runner \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg DIRECT_URL="$$DIRECT_URL" \
          --build-arg DATABASE_URL="$$DATABASE_URL" \
          --cache-from=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest \
          --tag=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA \
          --tag=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest

  - id: build-migrator-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['DIRECT_URL', 'DATABASE_URL']
    args:
      - -c
      - |
        docker pull ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:latest || true
        DOCKER_BUILDKIT=1 docker build . \
          --file=Dockerfile \
          --target=migrator \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg DIRECT_URL="$$DIRECT_URL" \
          --build-arg DATABASE_URL="$$DATABASE_URL" \
          --cache-from=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:latest \
          --tag=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:$COMMIT_SHA \
          --tag=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:latest

  - id: push-web-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
        docker push ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest

  - id: push-migrator-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:$COMMIT_SHA
        docker push ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:latest

  - id: deploy-migration-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATOR_JOB_NAME}
      - --image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_MIGRATOR_JOB_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,DIRECT_URL=${_DIRECT_URL_SECRET}:latest
      - --set-env-vars=NODE_ENV=production
      - --max-retries=1
      - --task-timeout=900s
      - --execute-now
      - --wait

  - id: deploy-web-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --execution-environment=gen2
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --ingress=${_INGRESS}
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,JWT_SECRET=${_JWT_SECRET_SECRET}:latest
      - --set-env-vars=NODE_ENV=production,OBJECT_STORAGE_PROVIDER=gcs,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GCS_PROJECT_ID=$PROJECT_ID,DEFAULT_TENANT_ID=cmnd84lsk0000i7x4y74rrtss
      - --allow-unauthenticated

  - id: smoke-test-health
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        SERVICE_URL="$$(gcloud run services describe "${_SERVICE_NAME}" --region "${_REGION}" --format='value(status.url)')"
        curl --fail --show-error --silent "$${SERVICE_URL}/api/health" > /dev/null
